<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Slate Obsidian -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181512"/>
      <stop offset="100%" stop-color="#0B0A08"/>
    </linearGradient>

    <!-- Warm Gold Gradient for Prompt & Cursor -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE19D"/>
      <stop offset="45%" stop-color="#E5B45F"/>
      <stop offset="100%" stop-color="#C8923A"/>
    </linearGradient>

    <!-- Metallic Border Gradient -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE19D" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#C8923A" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#5C4215" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="url(#bg)" stroke="url(#border)" stroke-width="14"/>

  <!-- Terminal Prompt > -->
  <path d="M 128 172 L 228 256 L 128 340" 
        fill="none" 
        stroke="url(#gold)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Terminal Cursor _ -->
  <line x1="272" y1="340" x2="384" y2="340" 
        stroke="url(#gold)" 
        stroke-width="44" 
        stroke-linecap="round"/>
</svg>